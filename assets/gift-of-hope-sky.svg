<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="night" x2="0.8" y2="1"><stop stop-color="#020711"/><stop offset=".48" stop-color="#07182d"/><stop offset="1" stop-color="#01040b"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#9aaec4" stop-opacity=".34"/><stop offset=".42" stop-color="#496b91" stop-opacity=".22"/><stop offset="1" stop-color="#071426" stop-opacity="0"/></radialGradient>
 <filter id="clouds" x="-20%" y="-30%" width="140%" height="160%">
  <feTurbulence type="fractalNoise" baseFrequency=".006 .018" numOctaves="2" seed="18" result="noise">
   <animate attributeName="baseFrequency" dur="90s" values=".005 .014;.008 .021;.005 .014" calcMode="linear" repeatCount="indefinite"/>
  </feTurbulence>
  <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
  <feComponentTransfer in="mono"><feFuncR type="gamma" amplitude="1.4" exponent="1.8" offset="-.25"/><feFuncG type="gamma" amplitude="1.5" exponent="1.8" offset="-.28"/><feFuncB type="gamma" amplitude="1.7" exponent="1.7" offset="-.3"/><feFuncA type="table" tableValues="0 .55"/></feComponentTransfer>
  <feGaussianBlur stdDeviation="9"/>
 </filter>
 <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#night)"/>
<ellipse cx="790" cy="540" rx="760" ry="340" fill="url(#glow)"/>
<g filter="url(#clouds)" opacity=".82"><rect x="-80" y="90" width="1760" height="850" fill="#9eb3ce"/></g>
<g filter="url(#soft)" opacity=".32" fill="none" stroke="#a9bfd9" stroke-width="70">
 <path d="M-80 480 Q160 250 390 440 T820 430 T1250 420 T1700 340"/>
 <path d="M-80 760 Q220 570 480 700 T980 660 T1600 620"/>
</g>
<rect width="1600" height="900" fill="url(#night)" opacity=".22"/>
<g fill="#eaf3ff">
 <circle cx="86" cy="104" r="1.8" opacity=".82"/><circle cx="203" cy="57" r="1.2" opacity=".7"/><circle cx="342" cy="139" r="1.5" opacity=".85"/><circle cx="486" cy="74" r="1.1" opacity=".75"/><circle cx="624" cy="112" r="1.4" opacity=".8"/><circle cx="748" cy="48" r="1.2" opacity=".8"/><circle cx="906" cy="125" r="1.7" opacity=".78"/><circle cx="1050" cy="65" r="1.1" opacity=".8"/><circle cx="1194" cy="120" r="1.5" opacity=".75"/><circle cx="1350" cy="54" r="1.3" opacity=".82"/><circle cx="1490" cy="132" r="1.6" opacity=".78"/>
 <circle cx="160" cy="260" r="1" opacity=".65"/><circle cx="430" cy="220" r="1.1" opacity=".72"/><circle cx="710" cy="250" r="1" opacity=".7"/><circle cx="1010" cy="205" r="1.2" opacity=".68"/><circle cx="1290" cy="250" r="1" opacity=".75"/><circle cx="1515" cy="310" r="1.2" opacity=".7"/>
</g>
</svg>