<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="daySky" x1="0" y1="0" x2="0" y2="1">
  <stop stop-color="#4d9fe0"/>
  <stop offset=".42" stop-color="#78bce9"/>
  <stop offset=".78" stop-color="#a9d8f2"/>
  <stop offset="1" stop-color="#d7edf9"/>
 </linearGradient>
 <radialGradient id="sunGlow">
  <stop stop-color="#fffef2" stop-opacity=".9"/>
  <stop offset=".34" stop-color="#fff8df" stop-opacity=".36"/>
  <stop offset="1" stop-color="#fff8df" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="cloudFace" x1="0" y1="0" x2="0" y2="1">
  <stop stop-color="#ffffff"/>
  <stop offset=".58" stop-color="#f7fcff"/>
  <stop offset="1" stop-color="#dceefa"/>
 </linearGradient>
 <filter id="cloudSoft" x="-30%" y="-80%" width="160%" height="260%">
  <feGaussianBlur stdDeviation="22"/>
 </filter>
 <filter id="cloudShadow" x="-20%" y="-30%" width="140%" height="180%">
  <feGaussianBlur stdDeviation="12"/>
 </filter>
</defs>
<rect width="1600" height="900" fill="url(#daySky)"/>
<circle cx="1220" cy="205" r="300" fill="url(#sunGlow)"/>
<circle cx="1220" cy="205" r="72" fill="#fffbea" opacity=".68"/>
<!-- Soft distant cloud banks add depth without dulling the blue sky. -->
<g fill="#ffffff" opacity=".32" filter="url(#cloudSoft)">
 <ellipse cx="220" cy="310" rx="300" ry="54"/>
 <ellipse cx="760" cy="455" rx="350" ry="58"/>
 <ellipse cx="1390" cy="370" rx="300" ry="62"/>
</g>
<!-- Main cloud forms have a clean white upper edge and cool, subtle undersides. -->
<g fill="#4e8fbd" opacity=".12" filter="url(#cloudShadow)">
 <path d="M-70 350c12-75 76-128 151-128 28-92 111-145 202-125 62-87 201-87 263-2 88-12 166 53 169 140 72 17 112 75 112 139H-70z"/>
 <path d="M800 520c12-65 69-111 137-111 28-80 100-123 179-105 58-73 169-70 218 8 76-5 139 51 141 126 72 16 112 63 112 112H800z"/>
</g>
<g fill="url(#cloudFace)">
 <path d="M-70 330c12-75 76-128 151-128 28-92 111-145 202-125 62-87 201-87 263-2 88-12 166 53 169 140 72 17 112 75 112 139H-70z"/>
 <path d="M800 500c12-65 69-111 137-111 28-80 100-123 179-105 58-73 169-70 218 8 76-5 139 51 141 126 72 16 112 63 112 112H800z"/>
 <path d="M360 665c10-47 53-82 104-82 20-57 72-88 128-75 42-52 121-50 156 6 54-4 99 36 100 90 51 11 80 45 80 80H360z" opacity=".86"/>
</g>
<g fill="#ffffff" opacity=".78">
 <ellipse cx="215" cy="207" rx="95" ry="26"/>
 <ellipse cx="285" cy="186" rx="82" ry="37"/>
 <ellipse cx="355" cy="211" rx="104" ry="27"/>
 <ellipse cx="1090" cy="384" rx="80" ry="23"/>
 <ellipse cx="1155" cy="365" rx="72" ry="34"/>
 <ellipse cx="1220" cy="388" rx="90" ry="25"/>
</g>
<!-- Fine high cloud wisps keep the composition airy and natural. -->
<g fill="none" stroke="#ffffff" stroke-linecap="round" opacity=".34">
 <path d="M80 110q110-35 210-4m-168 25q105-27 178-5" stroke-width="9"/>
 <path d="M690 160q90-28 170-4m-115 24q82-20 145-2" stroke-width="7"/>
 <path d="M1330 115q85-24 160-3" stroke-width="8"/>
</g>
</svg>