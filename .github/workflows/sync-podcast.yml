
name: Sync PED-Talk Podcast Episodes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-podcast.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-podcast
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Get website files
        uses: actions/checkout@v4

      - name: Fetch podcast episodes
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          feed_url = "https://anchor.fm/s/11831bbb8/podcast/rss"

          request = urllib.request.Request(
              feed_url,
              headers={"User-Agent": "PED-Talk-Website/1.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              root = ET.fromstring(response.read())

          channel = root.find("channel")
          episodes = []

          for item in channel.findall("item"):
              enclosure = item.find("enclosure")
              artwork = item.find("{http://www.itunes.com/dtds/podcast-1.0.dtd}image")
              if artwork is None:
                  artwork = item.find("image")
              if artwork is None:
                  artwork = channel.find("{http://www.itunes.com/dtds/podcast-1.0.dtd}image")
              description = item.find("description")
              published = item.find("pubDate")

              episodes.append({
                  "title": item.findtext("title", "Untitled episode"),
                  "description": item.findtext("description", ""),
                  "audio": enclosure.get("url", "") if enclosure is not None else "",
                  "link": item.findtext("link", ""),
                  "published": published.text if published is not None else "",
                  "image": (
                      artwork.get("href", "")
                      if artwork is not None
                      else ""
                  ),
                  "duration": item.findtext("{http://www.itunes.com/dtds/podcast-1.0.dtd}duration", "")
              })

          existing_episodes = []
          try:
              with open("episodes.json", "r", encoding="utf-8") as file:
                  existing_episodes = json.load(file).get("episodes", [])
          except (FileNotFoundError, json.JSONDecodeError, AttributeError):
              pass

          if episodes == existing_episodes:
              print(f"No catalogue changes. {len(episodes)} episodes are already synced.")
          else:
              data = {
                  "updated": datetime.now(timezone.utc).isoformat(),
                  "episodes": episodes
              }
              with open("episodes.json", "w", encoding="utf-8") as file:
                  json.dump(data, file, ensure_ascii=False, indent=2)
              print(f"Podcast catalogue updated: {len(episodes)} episodes.")

          print(f"Latest RSS episode: {episodes[0]['title'] if episodes else 'none'}")
          for episode in episodes[:5]:
              print(f"Artwork check: {episode['title']} -> {episode['image'] or 'NO EPISODE/CHANNEL ARTWORK'}")
          PY

      - name: Save updated episode catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes.json
          git diff --cached --quiet || (
            git commit -m "Update podcast episode catalogue" &&
            git push
          )
