name: PED-Talk live deployment smoke test

on:
  workflow_run:
    workflows: ["PED-Talk app regression"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ped-talk-live-smoke
  cancel-in-progress: false

jobs:
  live-mobile-book-flow:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Test the published PED-Talk app on a mobile viewport
        env:
          PED_TALK_LIVE_URL: https://ped-talkpodcast.github.io/app/
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--no-sandbox'] });
            const page = await browser.newPage({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 1,
              isMobile: true,
              hasTouch: true
            });
            const failures = [];
            let popupOpened = false;
            page.on('pageerror', error => failures.push('Browser error: ' + error.message));
          page.on('console', message => { if (message.type() === 'error') failures.push('Console error: ' + message.text()); });
          page.on('requestfailed', request => failures.push('Request failed: ' + request.url() + ' — ' + (request.failure()?.errorText || 'unknown')));
            page.on('popup', () => { popupOpened = true; });
            page.on('response', response => {
              if (response.status() >= 400 && new URL(response.url()).origin === new URL(process.env.PED_TALK_LIVE_URL).origin) {
                failures.push('HTTP ' + response.status() + ': ' + response.url());
              }
            });

            try {
              const response = await page.goto(process.env.PED_TALK_LIVE_URL, { waitUntil: 'domcontentloaded', timeout: 45000 });
              assert.ok(response && response.ok(), 'Published app URL must return a successful HTTP response');
              await page.waitForTimeout(2000);
          const startup = await page.evaluate(() => {
            const home = document.querySelector('#homeView');
            const nav = document.querySelector('.bottom-nav');
            const script = [...document.scripts].map(item => ({src:item.src, ready:item.readyState || 'loaded'}));
            return {url:location.href,title:document.title,readyState:document.readyState,homeExists:!!home,homeHidden:home?.hidden ?? null,homeDisplay:home?getComputedStyle(home).display:null,homeVisibility:home?getComputedStyle(home).visibility:null,navExists:!!nav,navDisplay:nav?getComputedStyle(nav).display:null,script};
          });
          console.log('STARTUP_DIAGNOSTICS ' + JSON.stringify(startup));
          await page.locator('#homeView').waitFor({ state: 'visible', timeout: 10000 });
          await page.locator('.bottom-nav [data-view="the-show"]').waitFor({ state: 'visible', timeout: 15000 });

              await page.locator('.bottom-nav [data-view="the-show"]').click();
              await page.locator('#theShowView').waitFor({ state: 'visible' });
              await page.locator('#theShowView [data-show-view="books"]').click();
              await page.locator('#booksView').waitFor({ state: 'visible' });
              await page.locator('[data-open-fiction-archive]').click();
              await page.locator('#fictionDetailView').waitFor({ state: 'visible' });

              assert.match(await page.locator('#fictionDetailTitle').textContent(), /THE BLACK MAN’S JESUS/i);
              assert.match(await page.locator('.fiction-detail-author,.fiction-detail-copy .fiction-book-author').first().textContent(), /Antwi Bosiako Papa Kofi/i);
              await page.locator('#fictionDetailDescription').waitFor({ state: 'hidden' });
              assert.ok((await page.locator('#fictionDetailDescription').textContent()).trim().length < 190, 'Book summary must be concise');
              const detailStyle = await page.locator('.fiction-detail-card').evaluate(el => ({ background:getComputedStyle(el).backgroundImage, cover:el.querySelector('img').getBoundingClientRect().width }));
              assert.match(detailStyle.background, /linear-gradient/, 'Book details must use the premium dark surface');
              assert.ok(detailStyle.cover >= 120, 'Book cover must be large enough on mobile');
              await page.locator('[data-open-fiction-reader]').click();
              await page.locator('#fictionView').waitFor({ state: 'visible' });
              await page.waitForFunction(
                () => document.querySelector('#fictionPdfPages .fiction-unified-text p') &&
                  document.querySelectorAll('#fictionPdfPages .fiction-unified-page-anchor').length > 2,
                null,
                { timeout: 60000 }
              );

              const result = await page.evaluate(() => ({
                width: innerWidth,
                documentWidth: document.documentElement.scrollWidth,
                pages: document.querySelectorAll('#fictionPdfPages .fiction-unified-page-anchor').length,
                paragraphs: document.querySelectorAll('#fictionPdfPages .fiction-unified-text p').length,
                unified: !!document.querySelector('#fictionPdfPages > .fiction-unified-text'),
                backVisible: !!document.querySelector('#fictionPageBack')
              }));
              assert.ok(result.documentWidth <= result.width, 'Published reader must not overflow horizontally on mobile');
              assert.ok(result.pages > 2 && result.paragraphs > 2 && result.unified, 'Published book must be one continuous reflowed text document with source-page anchors');
              assert.ok(result.backVisible, 'Published reader must provide a Back to book control');
              const scrollable = await page.locator('#fictionView').evaluate(el => ({height:el.clientHeight,scrollHeight:el.scrollHeight,overflow:getComputedStyle(el).overflowY}));
              assert.ok(scrollable.height > 0 && scrollable.scrollHeight > scrollable.height && scrollable.overflow === 'auto', 'Published reader must scroll within its viewport');
              const bottomScroll = await page.locator('#fictionView').evaluate(el => { el.scrollTo({top:el.scrollHeight,behavior:'instant'}); return {top:el.scrollTop,max:el.scrollHeight-el.clientHeight}; });
              assert.ok(bottomScroll.max > 0 && bottomScroll.top > 0, 'Published reader must scroll through the continuous book');
              assert.ok(await page.locator('#fictionPdfPages .fiction-unified-text p').count() > 2, 'Book text must remain present in the unified document after scrolling');
              assert.equal(popupOpened, false, 'Read Book must not open a new browser tab');

              await page.locator('#fictionPageBack').click();
              await page.locator('#fictionDetailView').waitFor({ state: 'visible' });
              assert.equal(popupOpened, false, 'Returning to details must stay inside PED-Talk');
              assert.deepEqual(failures, [], 'Published app must not produce browser or same-origin HTTP errors');

              console.log('PASS: live Pages URL, mobile book details, author and summary, in-app PDF rendering, no popup, mobile width and Back to book navigation.');
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
