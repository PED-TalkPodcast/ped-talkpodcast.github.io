name: PED-Talk app regression
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'assets/gift-of-hope-day.svg'
      - 'service-worker.js'
      - 'tests/**'
      - '.github/workflows/app-regression.yml'
      - '.github/workflows/app-live-smoke.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'assets/gift-of-hope-day.svg'
      - 'service-worker.js'
      - 'tests/**'
      - '.github/workflows/app-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ped-talk-app-regression
  cancel-in-progress: false
jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runtime
        run: npm install --no-save playwright
      - name: Install Chromium
        # The Ubuntu runner already supplies Chromium's common system libraries.
        # Avoid apt-based --with-deps here; it can stall while installing man-db triggers.
        run: npx playwright install chromium
      - name: Run PED-Talk browser flows
        run: node tests/app-regression.cjs
